name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install --yes poppler-utils
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --locked --manifest-path hub/Cargo.toml
      - name: Three-person project foundation and legacy isolation (real Hub, mock runtime)
        run: |
          node scripts/three-person-acceptance.test.cjs
          AGENCT_TEST_HUB_BINARY="$PWD/hub/target/debug/agenct-hub" node scripts/three-person-acceptance.cjs --scope all
      - run: npm run test:local
      - name: Browser flows against a real Hub (contacts, collaboration, profile chat, chat failures, projects)
        env:
          AGENCT_TEST_SCREENSHOT_DIR: ${{ runner.temp }}/hub-browser-screens
        run: npm run test:hub-browser
      - name: Upload real-Hub browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-browser-screens
          path: ${{ runner.temp }}/hub-browser-screens/
          if-no-files-found: ignore
          retention-days: 14
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install --yes fonts-dejavu-core fonts-droid-fallback
      - name: Browser interaction regressions (fixture API)
        run: npm run test:browser
      - name: Desktop, mobile and dark-mode visual regressions
        run: npm run test:visual
      - name: Upload screenshots, diffs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regressions
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
  python-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Standard-library protocol tests only: no provider keys, SDK, or Docker.
      # These are not evidence that real worker execution is enabled or trusted.
      - name: Test DSH adapter protocol
        run: python3 -m unittest discover -s adapters/dsh -p 'test*.py' -v
      - name: Test fail-closed sandbox and independent verifier
        run: python3 -m unittest discover -s sandbox -p 'test*.py' -v
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ephemeral OIDC fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssl poppler-utils
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --manifest-path hub/Cargo.toml -- --check
      - run: cargo +stable test --locked --manifest-path hub/Cargo.toml
      - run: cargo +stable clippy --locked --manifest-path hub/Cargo.toml --all-targets -- -D warnings
