name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path hub/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path hub/Cargo.toml
      - run: cargo clippy --locked --manifest-path hub/Cargo.toml --all-targets -- -D warnings
      - run: node --check hub/web/client.js
      - run: python3 -m unittest discover -s adapters/dsh -v
