name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rust format, clippy & tests
        run: |
          cargo fmt --manifest-path hub/Cargo.toml -- --check
          cargo clippy --manifest-path hub/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path hub/Cargo.toml
      - name: Python node & backup checks
        run: |
          python3 -m unittest discover -s node -p 'test_*.py' -v
          python3 -m py_compile node/agenct-node.py scripts/backup.py
      - name: Frontend ESM syntax check
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hub/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build Hub & run E2E suite
        run: |
          cargo build --manifest-path hub/Cargo.toml
          npm run test:e2e
