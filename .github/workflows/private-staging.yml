name: Private staging configuration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --locked --release --manifest-path hub/Cargo.toml
      - run: python3 scripts/smoke-private-staging.py
      # Real Rust/Python HTTP boundary, deterministic fixture only. No SDK/key.
      - name: Smoke Hub to Python adapter contract
        run: python3 scripts/smoke-hub-adapter.py
