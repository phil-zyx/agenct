# Agenct intranet deployment (GitLab login, open signup for active GitLab users).
# Host networking: the Hub binds the private IP directly and the model adapter
# stays on loopback, as the Hub's bind policy requires.
services:
  agenct:
    image: agenct:${AGENCT_IMAGE_TAG:-latest}
    container_name: agenct
    network_mode: host
    restart: unless-stopped
    env_file: agenct.env
    volumes:
      - ./data:/data
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
