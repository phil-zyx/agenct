  <nav class="rail" aria-label="主导航">
    <div class="rail-dock">
      <div class="rail-group">
        <span id="rail-indicator" class="rail-indicator" aria-hidden="true"></span>
        <button type="button" id="nav-chat" class="rail-btn active" title="聊天" aria-label="聊天" aria-current="page">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-chat"/></svg>
        </button>
        <button type="button" id="nav-tasks" class="rail-btn" title="工作台与节点" aria-label="工作台与节点" aria-pressed="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-tasks"/></svg>
          <span id="rail-badge" class="rail-badge"></span>
        </button>
        <button type="button" id="nav-contacts" class="rail-btn" title="联系人" aria-label="联系人" aria-expanded="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-contacts"/></svg>
        </button>
        <button type="button" id="nav-search" class="rail-btn" title="搜索历史与记忆 (Ctrl+K)" aria-label="搜索历史与记忆" aria-expanded="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-search"/></svg>
        </button>
      </div>
      <span class="rail-sep" aria-hidden="true"></span>
      <div class="rail-spacer"></div>
      <div class="rail-more-wrap">
        <button type="button" id="rail-more" class="rail-btn" title="设置与账号" aria-label="设置与账号" aria-haspopup="menu" aria-expanded="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-settings"/></svg>
        </button>
        <div id="rail-menu" class="rail-menu hide" role="menu" aria-label="设置与账号">
          <button type="button" id="toggle-sound" class="rail-menu-item" role="menuitem">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-sound"/></svg>
            <span id="sound-label">交互音效：柔和</span>
          </button>
          <button type="button" id="toggle-theme" class="rail-menu-item" role="menuitem">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use id="theme-menu-ic" href="#ic-theme"/></svg>
            <span id="theme-label">外观主题：跟随系统</span>
          </button>
          <button type="button" id="open-settings" class="rail-menu-item" role="menuitem">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-user"/></svg>
            <span>账号与设置</span>
          </button>
          <hr class="rail-menu-sep">
          <button type="button" id="logout-btn" class="rail-menu-item danger" role="menuitem">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-logout"/></svg>
            <span>退出登录</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

        </svg>
      </h1>
      <p class="lead">和你的管家一起处理工作。</p>
      <p id="login-error" class="login-error hide" role="alert"></p>
      <form id="local-login-form" class="local-login hide">
        <label class="field-label" for="local-login-token">登录令牌</label>
        <input id="local-login-token" type="password" name="token" autocomplete="current-password" placeholder="agl_..." required>
        <button type="submit" class="primary wide">登录</button>
        <p class="note">首次启动时令牌会打印在 Hub 日志里，并保存在数据目录的 <code>login-token</code> 文件中。</p>
      </form>
      <a id="gitlab-login-btn" class="primary wide btn-link hide" href="/auth/login">使用 GitLab 登录</a>
    </div>
  </section>

  <!-- Main Workspace -->
  <main id="room" class="app hide">
    <!-- Optional Left Contacts Sidebar -->
    <aside id="contact-sidebar" class="contact-sidebar hide" aria-label="联系人">
      <div class="sidebar-head">
        <strong>联系人</strong>
        <button type="button" id="close-contacts" class="icon-btn" aria-label="关闭联系人"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-close"/></svg></button>
      </div>
      <div id="contacts-list" class="sidebar-list"></div>
    </aside>

    <!-- Primary Centered Chat Column -->
    <section id="chat-pane" class="chat-pane" data-agent-state="idle" aria-label="与管家的对话">
      <div class="ambient-aura" aria-hidden="true"></div>
      <div id="search-panel" class="cmd-backdrop hide" role="dialog" aria-modal="true" aria-label="指令舱与搜索">
        <div class="cmd-modal">
          <div class="cmd-head">
            <svg class="ic cmd-head-ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-search"/></svg>
            <input id="search-input" type="search" placeholder="搜索对话、事项、记忆，或输入指令（切引擎 / 音效 / 形象 / 设置）…" autocomplete="off">
            <kbd class="cmd-kbd">ESC</kbd>
            <button type="button" id="close-search" class="icon-btn" aria-label="关闭搜索"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-close"/></svg></button>
          </div>
          <div id="search-results" class="cmd-results"></div>
          <div class="cmd-foot">
            <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
            <span><kbd>↵</kbd> 执行</span>
            <span><kbd>⌘K</kbd> 唤起</span>
          </div>
        </div>
      </div>
      <div id="thread-filter-bar" class="thread-filter-bar hide" role="status">
        <span id="thread-filter-title"></span>
        <button type="button" id="clear-thread-filter" class="text-btn sm">返回全部对话</button>
      </div>
      <div class="scroller-wrap">
        <div class="chat-fade-top" aria-hidden="true"></div>
        <div id="scroller" class="scroller">
          <div id="island-shell" class="island-shell">
            <button type="button" id="muse-head-toggle" class="stream-head" data-agent-state="idle" aria-label="打开管家工作台" aria-expanded="false">
              <span class="avatar-stage">
                <img id="head-avatar" class="avatar" src="brand/agenct-icon.svg" alt="" width="40" height="40">
                <span id="head-avatar-buddy" class="avatar-buddy hide" aria-hidden="true"></span>
                <span id="head-avatar-badge" class="avatar-status-badge" aria-hidden="true"></span>
              </span>
              <span class="island-meta">
                <span id="agent-name" class="avatar-name">Agenct</span>
                <span id="head-state-text" class="island-sub">在线待命</span>
              </span>
              <span class="island-wave" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
          </div>
          <div id="load-older-wrap" class="load-older-wrap hide">
            <button type="button" id="load-older-btn" class="sm">加载更早消息</button>
          </div>
          <div id="chat-starters" class="chat-starters hide" aria-label="快速开始"></div>
          <div id="messages" class="stream" aria-label="对话记录"></div>
          <div id="stream-live" class="stream-live hide" aria-live="polite">
            <div id="streaming-msg" class="msg msg-assistant msg-streaming"></div>
          </div>
          <div id="typing" class="typing hide" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
        <button type="button" id="scroll-bottom-btn" class="scroll-bottom-btn" aria-label="回到底部">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-down"/></svg>
          <span id="scroll-bottom-label" class="scroll-bottom-label">有新回复</span>
        </button>
      </div>

      <form id="chat-form" class="composer">
        <div id="stage-bar" class="stage-pill hide">
          <div class="stage-row">
            <span class="stage-lead">
              <span id="work-indicator" class="pixel-grid" data-think-variant="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
              <span id="work-stage" class="shimmer-label" role="status"></span>
            </span>
            <span class="stage-right">
              <span id="work-elapsed" class="work-elapsed"></span>
              <button type="button" id="work-stop-btn" class="stage-stop-btn hide" aria-label="长按中止当前任务"><span class="stop-sq" aria-hidden="true"></span><span>停止</span></button>
            </span>
          </div>
          <details id="work-log" class="work-log hide">
            <summary>执行动态</summary>
            <div id="work-log-tail"></div>
          </details>
        </div>
        <div id="pending-atts" class="chat-attachments hide"></div>
        <div id="composer-suggest" class="composer-suggest hide" role="listbox" aria-label="输入补全建议"></div>
        <div class="composer-pill">
          <svg id="composer-orbit" class="composer-orbit" aria-hidden="true">
            <defs>
              <linearGradient id="composer-comet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="var(--brand)"/>
                <stop offset="50%" stop-color="var(--info)"/>
                <stop offset="100%" stop-color="var(--brand)"/>
              </linearGradient>
            </defs>
            <rect class="orbit-bloom" pathLength="1000"/>
            <rect class="orbit-glow" pathLength="1000"/>
            <rect class="orbit-core" pathLength="1000"/>
          </svg>
          <label class="attach-btn" title="添加附件 (图片/PDF/ZIP/文本)" aria-label="添加附件">
            <input id="file-input" type="file" hidden>
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-attach"/></svg>
            <span>附件</span>
          </label>
          <div id="composer-engine-wrap" class="engine-pill-wrap hide">
            <button type="button" id="composer-engine-btn" class="engine-pill-btn" aria-haspopup="menu" aria-expanded="false" title="切换当前主节点默认引擎">
              <span class="engine-pill-dot" aria-hidden="true"></span>
              <span id="composer-engine-label" class="engine-pill-label"></span>
              <svg class="ic engine-pill-caret" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-caret"/></svg>
            </button>
            <div id="composer-engine-menu" class="engine-menu hide" role="menu" aria-label="切换节点默认引擎"></div>
          </div>
          <textarea id="chat-input" rows="1" placeholder="直接告诉我你想解决的问题，或 @同事 协作…"></textarea>
          <button type="submit" id="send-btn" class="send-btn" aria-label="发送">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-send"/></svg>
          </button>
        </div>
      </form>
    </section>

    <!-- Optional Full-Canvas Settings Pane (opened from left rail "账号与设置") -->
    <section id="settings-view" class="settings-pane hide" aria-label="账号与设置">
      <div class="settings-inner">
        <header class="settings-head">
          <div>
            <h2>账号与设置</h2>
            <p id="settings-identity" class="note"></p>
          </div>
          <button type="button" id="close-settings" class="text-btn">返回聊天</button>
        </header>
        <div id="settings-body" class="settings-body"></div>
      </div>
    </section>

    <!-- Optional Right Muse Drawer (opened by clicking floating avatar or rail "任务") -->
    <aside id="task-pane" class="task-pane" aria-label="管家工作台">
      <div class="muse-hero">
        <button type="button" id="close-drawer" class="icon-btn muse-close-btn" aria-label="关闭工作台"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-close"/></svg></button>
        <div id="hero-avatar-wrap" class="muse-hero-avatar-wrap" data-agent-state="idle">
          <span class="avatar-stage big">
            <img id="drawer-avatar" class="avatar big" src="brand/agenct-icon.svg" alt="" width="88" height="88">
            <span id="drawer-avatar-buddy" class="avatar-buddy big hide" aria-hidden="true"></span>
            <span id="drawer-avatar-badge" class="avatar-status-badge big" aria-hidden="true"></span>
            <button type="button" id="status-picker-btn" class="status-picker-btn" aria-label="展开快捷操作与状态" aria-expanded="false" aria-controls="status-tray">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </span>
        </div>
        <div id="status-tray-wrap" class="status-tray-wrap" aria-hidden="true">
          <span id="status-tray-tip" class="status-tray-tip" aria-hidden="true"></span>
          <div id="status-tray" class="status-tray" role="toolbar" aria-label="管家快捷操作">
            <button type="button" class="status-orb" data-status-act="poke" data-tip="戳一下" aria-label="戳一下">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-poke"/></svg>
            </button>
            <button type="button" class="status-orb" data-status-act="avatar" data-tip="切换形象" aria-label="切换形象">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-avatar"/></svg>
            </button>
            <button type="button" class="status-orb" data-status-act="search" data-tip="全局搜索" aria-label="全局搜索">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-search"/></svg>
            </button>
            <button type="button" class="status-orb" id="status-sound-orb" data-status-act="sound" data-tip="交互音效：开" aria-label="切换交互音效" aria-pressed="true">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-sound"/></svg>
            </button>
            <button type="button" class="status-orb" id="status-theme-orb" data-status-act="theme" data-tip="外观主题：跟随系统" aria-label="切换外观主题">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use id="status-theme-ic" href="#ic-theme"/></svg>
            </button>
            <button type="button" class="status-orb" data-status-act="settings" data-tip="节点与设置" aria-label="节点与设置">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-tuning"/></svg>
            </button>
          </div>
        </div>
        <div class="muse-name-wrap">
          <button type="button" id="edit-agent-name-btn" class="muse-name-btn" title="点击修改管家名字" aria-label="修改管家名字">
            <h2 id="drawer-agent-name" class="muse-drawer-name">Agenct</h2>
            <svg class="ic muse-name-edit-ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-edit"/></svg>
          </button>
          <input id="drawer-agent-name-input" class="muse-name-input hide" type="text" maxlength="48" autocomplete="off" aria-label="输入新的管家名字">
        </div>
        <p class="muse-conn-status">
          <span id="avatar-state-pill" class="avatar-state-pill" data-agent-state="idle">在线待命</span>
          <span>·</span>
          <span id="sse-bolt" class="muse-conn-bolt">⚡</span>
          <span id="sse-pill">连接中…</span>
          <span>·</span>
          <span id="node-pill">0 节点在线</span>
        </p>
      </div>

      <div class="muse-seg-wrap">
        <div class="seg muse-seg" role="tablist" data-active-idx="0">
          <button type="button" class="tab on" data-tab="tasks" role="tab" aria-selected="true">工作台</button>
          <button type="button" class="tab" data-tab="soul" role="tab" aria-selected="false">人设记忆</button>
        </div>
      </div>

      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
