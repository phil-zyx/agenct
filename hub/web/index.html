<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenct · Rust Hub</title>
<style>
body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f7f9f6;color:#183b31}
textarea,input,button{font:inherit;padding:12px;border:1px solid #bbcfc5;border-radius:8px}
textarea{width:95%;min-height:80px}button{cursor:pointer;background:#173e32;color:white;margin:5px}
button:disabled{opacity:.5;cursor:wait}
article{padding:16px;background:white;border:1px solid #d5e0d8;border-radius:12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#56675f}#status{white-space:pre-wrap;color:#8b332a}.hide{display:none}
</style>
<h1>Agenct</h1>
<p>一个窗口，与你的管家协作。</p>
<small>开发验证版 · 仅本机 · 无真实代码执行或 GitHub 发布。令牌只保留在页面内存。</small>
<section id="login">
  <p><input type="password" id="token" placeholder="输入开发访问令牌" aria-label="开发访问令牌" autocomplete="off"><button id="enter">进入</button></p>
</section>
<section id="room" class="hide">
  <p id="identity"></p>
  <button id="logout">退出</button><button id="refresh">刷新本账号会话与任务</button>
  <p><small id="last-refresh"></small></p>
  <div id="conversation" aria-label="私聊、待确认提案与任务"></div>
  <form id="form">
    <textarea id="text" aria-label="给管家发消息" placeholder="给管家发消息。Mock 示例：请让 bob 帮我 检查文档。也可输入 /delegate bob 任务摘要；确认前不会委派。"></textarea>
    <button id="send">发送</button>
  </form>
  <small>Mock 模式仅按固定规则匹配文本，不是真实 AI 理解或自动执行。自然语言委派和 /delegate 都只生成待确认提案。确认后才共享摘要、创建服务端任务；完整私聊不共享。任务状态来自当前账号的服务端快照，需手动刷新。交付按钮提交人工结果，不是自动执行证据。</small>
</section>
<p id="status" role="status"></p>
<script src="client.js"></script>
</html>
