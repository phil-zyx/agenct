<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenct · Rust Hub</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f7f9f6;color:#183b31}textarea,input,button{font:inherit;padding:12px;border:1px solid #bbcfc5;border-radius:8px}textarea{width:95%;min-height:80px}button{cursor:pointer;background:#173e32;color:white;margin:5px}article{padding:16px;background:white;border:1px solid #d5e0d8;border-radius:12px;margin:12px 0;white-space:pre-wrap}small{color:#56675f}#status{white-space:pre-wrap;color:#8b332a}.hide{display:none}</style><h1>Agenct</h1><p>一个窗口，与你的管家协作。</p><small>开发验证版 · 仅本机 · 无真实代码执行或 GitHub 发布。令牌只保留在页面内存。</small><section id="login"><p><input type="password" id="token" placeholder="输入开发访问令牌" autocomplete="off"><button id="enter">进入</button></p></section><section id="room" class="hide"><p id="identity"></p><button id="logout">退出</button><button id="refresh">刷新消息和任务</button><div id="messages"></div><div id="tasks"></div><form id="form"><textarea id="text" placeholder="给管家发消息。创建真实任务记录：/delegate bob 任务摘要"></textarea><button>发送</button></form><small>任务记录是真实服务端数据；mock 模式回复是固定脚本。交付按钮提交的是人工结果，不是自动执行证据。</small></section><p id="status" role="status"></p><script src="client.js"></script></html>
