<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Agenct</title>
  <link rel="icon" type="image/svg+xml" href="brand/agenct-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/agenct-icon-32.png">
  <link rel="apple-touch-icon" href="brand/agenct-icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast hide" role="status" aria-live="polite"></div>

  <!-- Login View (GitLab OAuth only) -->
  <main id="login-view" class="login-wrap hide">
    <section class="login-card">
      <div class="brand-lockup">
        <img src="brand/agenct-icon.svg" alt="Agenct" width="48" height="48">
        <h1>Agenct</h1>
      </div>
      <p class="muted">7×24h 个人超级智能体 · 云端与本地执行节点统一控制面</p>
      <p id="login-error" class="alert hide" role="alert"></p>
      <a id="gitlab-login-btn" class="btn primary wide" href="/auth/login">使用 GitLab 登录</a>
    </section>
  </main>

  <!-- Main Workspace -->
  <div id="app-view" class="workspace hide">
    <section class="chat-col">
      <header class="topbar">
        <div class="topbar-left">
          <img src="brand/agenct-icon.svg" alt="" width="30" height="30">
          <strong id="agent-name">Agenct</strong>
          <span id="node-pill" class="pill muted">0 节点在线</span>
          <span id="sse-pill" class="pill muted">连接中…</span>
        </div>
        <div class="topbar-right">
          <span id="user-label" class="muted small"></span>
          <button type="button" id="toggle-drawer" class="btn">工作台</button>
          <button type="button" id="logout-btn" class="btn ghost">退出</button>
        </div>
      </header>

      <div id="messages" class="messages" aria-label="对话记录"></div>

      <div id="stage-bar" class="stage-bar hide" role="status" aria-live="polite"></div>

      <form id="chat-form" class="composer">
        <div id="pending-atts" class="att-chips hide"></div>
        <div class="composer-row">
          <label class="btn ghost icon" title="添加附件 (图片/PDF/ZIP/文本)">
            <input id="file-input" type="file" hidden>
            📎
          </label>
          <textarea id="chat-input" rows="1" placeholder="直接对话、@同事 协作、或让节点执行本机/云端任务… (Enter 发送, Shift+Enter 换行)"></textarea>
          <button type="submit" id="send-btn" class="btn primary">发送</button>
        </div>
      </form>
    </section>

    <aside id="drawer" class="drawer">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="work" role="tab" aria-selected="true">任务与节点</button>
        <button type="button" class="tab" data-tab="memory" role="tab" aria-selected="false">台账与定时</button>
        <button type="button" class="tab" data-tab="settings" role="tab" aria-selected="false">人设与设置</button>
      </nav>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
