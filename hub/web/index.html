<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>Agenct</title>
  <link rel="icon" type="image/svg+xml" href="brand/agenct-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/agenct-icon-32.png">
  <link rel="apple-touch-icon" href="brand/agenct-icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="rail" aria-label="主导航">
    <img class="rail-logo" src="brand/agenct-icon.svg" alt="Agenct" width="34" height="34">
    <button type="button" id="nav-chat" class="rail-btn active" title="聊天" aria-label="聊天" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.4 6.5L4 20l1.3-3.6A7.9 7.9 0 0 1 4 12Z"/></svg>
    </button>
    <button type="button" id="nav-tasks" class="rail-btn" title="工作线程与节点" aria-label="工作线程与节点" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      <span id="rail-badge" class="rail-badge"></span>
    </button>
    <button type="button" id="nav-contacts" class="rail-btn" title="联系人" aria-label="联系人" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="3"/><path d="M3 7h4M3 12h4M3 17h4"/><circle cx="12.5" cy="9" r="2.2"/><path d="M9 17a3.5 3.5 0 0 1 7 0"/></svg>
    </button>
    <button type="button" id="nav-search" class="rail-btn" title="搜索历史与记忆 (Ctrl+K)" aria-label="搜索历史与记忆" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <div class="rail-more-wrap">
      <button type="button" id="rail-more" class="rail-btn" title="设置与账号" aria-label="设置与账号" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
      </button>
      <div id="rail-menu" class="rail-menu hide" role="menu" aria-label="设置与账号">
        <button type="button" id="open-settings" class="rail-menu-item" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
          <span>账号与设置</span>
        </button>
        <hr class="rail-menu-sep">
        <button type="button" id="logout-btn" class="rail-menu-item danger" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg>
          <span>退出登录</span>
        </button>
      </div>
    </div>
  </nav>

  <p id="toast" class="toast hide" role="status" aria-live="polite"></p>

  <!-- Login View (GitLab OAuth and/or local owner token) -->
  <section id="login-view" class="login hide">
    <div class="login-card">
      <h1 class="login-brand">
        <img src="brand/agenct-icon.svg" alt="" width="48" height="48">
        <svg class="login-wordmark" viewBox="0 280 3278 960" role="img" aria-label="Agenct">
          <path d="M15 1000 294.5 294.0H436.5L713.5 1000.0H547.5L336 414H393L178 1000ZM174.0 872.5V744.5H558.5V872.5Z"/>
          <path d="M978.5 1218.0Q899.0 1218 838.5 1190.5Q778.0 1163 743.0 1113L837.0 1019.5Q863.0 1050 895.5 1066.25Q928.0 1082.5 974.0 1082.5Q1030.5 1082.5 1063.25 1054.25Q1096.0 1026 1096.0 975V851L1121.5 745.0L1098.5 639.0V514.0H1249.0V971Q1249.0 1046 1214.0 1101.25Q1179.0 1156.5 1118.0 1187.25Q1057.0 1218 978.5 1218.0ZM971.5 985.0Q905.0 985 852.75 953.25Q800.5 921.5 770.75 866.5Q741.0 811.5 741.0 744Q741.0 676 770.75 621.75Q800.5 567.5 852.75 535.75Q905.0 504 971.5 504.0Q1021.5 504.0 1061.25 522.75Q1101.0 541.5 1125.25 574.75Q1149.5 608.0 1153.0 652V837Q1149.5 880.5 1125.0 914.0Q1100.5 947.5 1060.75 966.25Q1021.0 985 971.5 985.0ZM1000.5 849.5Q1032.5 849.5 1056.0 835.5Q1079.5 821.5 1092.25 797.75Q1105.0 774 1105.0 744Q1105.0 714 1092.25 690.25Q1079.5 666.5 1056.25 652.5Q1033.0 638.5 1001.0 638.5Q969.5 638.5 945.75 652.5Q922.0 666.5 909.0 690.5Q896.0 714.5 896.0 744Q896.0 772.5 909.0 796.75Q922.0 821 945.5 835.25Q969.0 849.5 1000.5 849.5Z"/>
          <path d="M1586.5 1011.0Q1507.5 1011.0 1446.25 978.5Q1385.0 946 1350.0 888.25Q1315.0 830.5 1315.0 757Q1315.0 684 1349.25 626.75Q1383.5 569.5 1442.75 536.25Q1502.0 503 1575.5 503.0Q1647.5 503.0 1702.75 534.25Q1758.0 565.5 1789.5 620.5Q1821.0 675.5 1821.0 746Q1821.0 759.5 1819.5 774.0Q1818.0 788.5 1814.0 807L1395.0 808.5V703.5L1749.0 702L1683.0 746.5Q1682.0 704.5 1669.75 676.75Q1657.5 649.0 1634.25 634.5Q1611.0 620 1576.5 620.0Q1540.5 620.0 1514.0 636.5Q1487.5 653.0 1473.25 683.25Q1459.0 713.5 1459.0 756Q1459.0 799 1474.25 829.75Q1489.5 860.5 1518.0 876.75Q1546.5 893.0 1586.0 893Q1622.0 893 1651.0 880.75Q1680.0 868.5 1702.0 843.5L1786.0 927.5Q1750.0 969 1699.0 990.0Q1648.0 1011 1586.5 1011.0Z"/>
          <path d="M2206.0 1000V723.5Q2206.0 685 2182.5 661.75Q2159.0 638.5 2122.62 638.5Q2097.87 638.5 2078.69 649.0Q2059.5 659.5 2048.75 678.75Q2038.0 698 2038.0 723.5L1978.5 694.5Q1978.5 637.0 2003.75 594.25Q2029.0 551.5 2073.45 527.75Q2117.9 504.0 2174.2 504.0Q2227.5 504.0 2269.25 529.5Q2311.0 555 2335.0 597.0Q2359.0 639 2359.0 689V1000ZM1885.0 1000V514H2038.0V1000Z"/>
          <path d="M2682.0 1011Q2606.5 1011.0 2545.75 978.0Q2485.0 945 2450.0 887.25Q2415.0 829.5 2415.0 757.5Q2415.0 684.5 2450.25 627.0Q2485.5 569.5 2546.5 536.25Q2607.5 503.0 2683.5 503.0L2900 503 L2900 644 L2683.5 642.0Q2651.0 642 2625.5 656.5Q2600.0 671 2585.25 696.5Q2570.5 722.0 2570.5 756.5Q2570.5 790.5 2585.25 816.5Q2600.0 842.5 2625.75 857.25Q2651.5 872.0 2683.5 872.0Q2714.0 872 2737.25 861.75Q2760.5 851.5 2777.5 832.0L2875.0 930Q2836.5 970.0 2788.75 990.5Q2741.0 1011 2682.0 1011Z"/>
          <path d="M3002.0 1000V313H3155.0V1000ZM2892.0 644V503H3265.0V644Z"/>
        </svg>
      </h1>
      <p class="lead">和你的管家一起处理工作。</p>
      <p id="login-error" class="login-error hide" role="alert"></p>
      <form id="local-login-form" class="local-login hide">
        <label class="field-label" for="local-login-token">登录令牌</label>
        <input id="local-login-token" type="password" name="token" autocomplete="current-password" placeholder="agl_..." required>
        <button type="submit" class="primary wide">登录</button>
        <p class="note">首次启动时令牌会打印在 Hub 日志里，并保存在数据目录的 <code>login-token</code> 文件中。</p>
      </form>
      <a id="gitlab-login-btn" class="primary wide btn-link hide" href="/auth/login">使用 GitLab 登录</a>
    </div>
  </section>

  <!-- Main Workspace -->
  <main id="room" class="app hide">
    <!-- Optional Left Contacts Sidebar -->
    <aside id="contact-sidebar" class="contact-sidebar hide" aria-label="联系人">
      <div class="sidebar-head">
        <strong>联系人</strong>
        <button type="button" id="close-contacts" class="icon-btn" aria-label="关闭联系人">✕</button>
      </div>
      <div id="contacts-list" class="sidebar-list"></div>
    </aside>

    <!-- Primary Centered Chat Column -->
    <section id="chat-pane" class="chat-pane" aria-label="与管家的对话">
      <div id="search-panel" class="search-panel hide" aria-label="搜索对话、事项与记忆">
        <div class="search-panel-head">
          <input id="search-input" type="search" placeholder="搜索对话记录、持续事项或长期记忆… (Ctrl+K)" autocomplete="off">
          <button type="button" id="close-search" class="icon-btn" aria-label="关闭搜索">✕</button>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
      <div id="thread-filter-bar" class="thread-filter-bar hide" role="status">
        <span id="thread-filter-title"></span>
        <button type="button" id="clear-thread-filter" class="text-btn sm">返回全部对话</button>
      </div>
      <div id="scroller" class="scroller">
        <button type="button" id="muse-head-toggle" class="stream-head" data-agent-state="idle" aria-label="打开管家工作台" aria-expanded="false">
          <span class="avatar-stage">
            <img id="head-avatar" class="avatar" src="brand/agenct-icon.svg" alt="" width="40" height="40">
            <span id="head-avatar-buddy" class="avatar-buddy hide" aria-hidden="true"></span>
            <span id="head-avatar-badge" class="avatar-status-badge" aria-hidden="true"></span>
          </span>
          <span id="agent-name" class="avatar-name">Agenct</span>
        </button>
        <div id="load-older-wrap" class="load-older-wrap hide">
          <button type="button" id="load-older-btn" class="sm">加载更早消息</button>
        </div>
        <div id="messages" class="stream" aria-label="对话记录"></div>
        <div id="stream-live" class="stream-live hide" aria-live="polite">
          <div id="streaming-msg" class="msg msg-assistant msg-streaming"></div>
        </div>
        <div id="typing" class="typing hide" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>

      <form id="chat-form" class="composer">
        <div id="stage-bar" class="stage-pill hide">
          <div class="stage-row">
            <span id="work-stage" role="status"></span>
            <span id="work-elapsed" class="work-elapsed"></span>
          </div>
          <details id="work-log" class="work-log hide">
            <summary>最近日志</summary>
            <div id="work-log-tail"></div>
          </details>
        </div>
        <div id="pending-atts" class="chat-attachments hide"></div>
        <div class="composer-pill">
          <label class="attach-btn" title="添加附件 (图片/PDF/ZIP/文本)" aria-label="添加附件">
            <input id="file-input" type="file" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <span>附件</span>
          </label>
          <textarea id="chat-input" rows="1" placeholder="直接告诉我你想解决的问题，或 @同事 协作…"></textarea>
          <button type="submit" id="send-btn" class="send-btn" aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </section>

    <!-- Optional Full-Canvas Settings Pane (opened from left rail "账号与设置") -->
    <section id="settings-view" class="settings-pane hide" aria-label="账号与设置">
      <div class="settings-inner">
        <header class="settings-head">
          <div>
            <h2>账号与设置</h2>
            <p id="settings-identity" class="note"></p>
          </div>
          <button type="button" id="close-settings" class="text-btn">返回聊天</button>
        </header>
        <div id="settings-body" class="settings-body"></div>
      </div>
    </section>

    <!-- Optional Right Muse Drawer (opened by clicking floating avatar or rail "任务") -->
    <aside id="task-pane" class="task-pane" aria-label="管家工作台">
      <div class="muse-hero">
        <button type="button" id="close-drawer" class="icon-btn muse-close-btn" aria-label="关闭工作台">✕</button>
        <div id="hero-avatar-wrap" class="muse-hero-avatar-wrap" data-agent-state="idle">
          <span class="avatar-stage big">
            <img id="drawer-avatar" class="avatar big" src="brand/agenct-icon.svg" alt="" width="88" height="88">
            <span id="drawer-avatar-buddy" class="avatar-buddy big hide" aria-hidden="true"></span>
            <span id="drawer-avatar-badge" class="avatar-status-badge big" aria-hidden="true"></span>
          </span>
        </div>
        <h2 id="drawer-agent-name" class="muse-drawer-name">Agenct</h2>
        <p class="muse-conn-status">
          <span id="avatar-state-pill" class="avatar-state-pill" data-agent-state="idle">在线待命</span>
          <span>·</span>
          <span id="sse-bolt" class="muse-conn-bolt">⚡</span>
          <span id="sse-pill">连接中…</span>
          <span>·</span>
          <span id="node-pill">0 节点在线</span>
        </p>
      </div>

      <div class="muse-seg-wrap">
        <div class="seg muse-seg" role="tablist">
          <button type="button" class="tab on" data-tab="tasks" role="tab" aria-selected="true">工作线程</button>
          <button type="button" class="tab" data-tab="soul" role="tab" aria-selected="false">人设记忆</button>
        </div>
      </div>

      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
