<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenct · Rust Hub</title>
<link rel="stylesheet" href="style.css">
<h1>Agenct</h1>
<p>一个窗口，与你的管家协作。</p>
<small>验证版 · 无真实代码执行或 GitHub 发布。开发令牌仅保留在页面内存；浏览器登录由服务器管理会话。</small>
<section id="login">
  <p id="dev-login" class="hide"><input type="password" id="token" placeholder="输入开发访问令牌" aria-label="开发访问令牌" autocomplete="off"><button id="enter">进入</button></p>
  <button id="oidc-login" class="hide">通过身份提供方登录</button>
  <button id="auth-retry" class="hide">重试登录状态检查</button>
</section>
<section id="room" class="hide">
  <p id="identity"></p>
  <button id="logout">退出</button><button id="refresh">刷新本账号会话与任务</button>
  <p><small id="last-refresh"></small></p>
  <p id="sync-notice" role="status" aria-live="polite"></p>
  <div id="conversation" aria-label="私聊、待确认提案与任务"></div>
  <form id="form">
    <textarea id="text" aria-label="给管家发消息" placeholder="输入 /agents 配置个人 Agent（仅配置存储）。Mock 示例：请让 bob 帮我 检查文档。也可输入 /delegate bob 任务摘要；确认前不会委派。"></textarea>
    <button id="send">发送</button>
  </form>
  <small>Mock 模式仅按固定规则匹配文本，不是真实 AI 理解或自动执行。自然语言委派和 /delegate 都只生成待确认提案。确认后才共享摘要、创建服务端任务；完整私聊不共享。任务状态来自当前账号的服务端快照，页面可见时每 5 秒自动检查更新，离线后自动重试。交付按钮提交人工结果，不是自动执行证据。</small>
</section>
<p id="status" role="status"></p>
<script src="profiles-ui.js"></script>
<script src="client.js"></script>
</html>
